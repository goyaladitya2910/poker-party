<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>POKER PARTY</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>

:root{--navy:#101329;--pur:#21163D;--ind:#292450;--pur2:#47336F;--em:#39865F;--felt:#246747;--gold:#FFD86B;--pale:#FFF0A3;--blue:#5DC9FF;--coral:#FF739C;--mut:#AAAFC5;--tf:#39865F;--tf2:#246747;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{font-family:"Trebuchet MS",Verdana,sans-serif;color:#fff;background:linear-gradient(#101329,#21163D 60%,#47336F);overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
#bg{position:fixed;inset:0;z-index:0;overflow:hidden}
#bg .st{position:absolute;inset:0 0 40% 0;background:radial-gradient(1px 1px at 20px 30px,#fff,transparent),radial-gradient(1.5px 1.5px at 90px 80px,#FFF0A3,transparent),radial-gradient(1px 1px at 160px 20px,#fff,transparent);background-size:200px 120px;opacity:.7}
#bg svg{position:absolute;bottom:0;width:100%;height:45%}
#bg .cab{position:absolute;left:4%;bottom:8%;width:70px;height:50px;background:#3a2638;border-radius:4px 4px 0 0}
#bg .cab:after{content:"";position:absolute;left:12px;top:14px;width:16px;height:16px;background:#ffc65a;box-shadow:0 0 18px #ffb43a}
#bg .neon{position:absolute;right:5%;top:8%;font-weight:900;letter-spacing:3px;color:#ff9bd0;text-shadow:0 0 10px #ff4fa3;opacity:.45;font-size:14px}
.ff{position:absolute;width:4px;height:4px;border-radius:50%;background:#FFF0A3;box-shadow:0 0 8px #FFD86B;animation:fl 9s ease-in-out infinite}
@keyframes fl{0%,100%{transform:translate(0,0);opacity:.2}50%{transform:translate(30px,-40px);opacity:1}}
.scr{position:fixed;inset:0;z-index:2;display:none;flex-direction:column;align-items:center;padding:16px;overflow:auto;animation:fi .5s}
.scr.on{display:flex}@keyframes fi{from{opacity:0;transform:translateY(12px)}}
nav{display:flex;gap:8px;align-self:stretch;justify-content:center;flex-wrap:wrap}
nav button,.pill{background:var(--ind);border:2px solid var(--pur2);border-radius:20px;padding:6px 14px;font-weight:700}
nav button:hover{border-color:var(--gold)}
.logo{font-size:clamp(40px,10vw,92px);font-weight:900;line-height:.95;text-align:center;color:#fff;-webkit-text-stroke:3px var(--pur);text-shadow:0 5px 0 var(--pur2),0 0 30px #FFD86B66;margin-top:4vh}
.logo b{color:var(--gold)}.tag{color:var(--pale);margin:12px 0 22px;text-align:center}
.play{background:var(--pur);border:3px solid var(--gold);border-radius:18px;padding:14px 46px;font-size:24px;font-weight:900;letter-spacing:2px;box-shadow:0 5px 0 #0007,0 0 18px #FFD86B55;transition:.15s}
.play:hover{transform:translateY(-3px)}.play:active{transform:translateY(3px);box-shadow:0 1px 0 #0007}
.cards{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:30px;max-width:900px}
.fc{background:var(--ind);border:2px solid var(--pur2);border-radius:16px;padding:14px;width:160px;text-align:center;font-size:13px;transition:.2s}
.fc:hover{transform:translateY(-5px);border-color:var(--gold)}.fc i{display:block;font-size:34px;font-style:normal}
.panel{background:#292450ee;border:2px solid var(--pur2);border-radius:18px;padding:18px;width:min(520px,100%);margin-top:3vh}
.panel h2{margin:0 0 10px}label{display:block;margin:10px 0 4px;color:var(--mut);font-size:13px}
input,select{width:100%;padding:10px;border-radius:12px;border:2px solid var(--pur2);background:var(--navy);color:#fff;font:inherit}
input:focus,select:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px #FFD86B44}
.avs{display:flex;flex-wrap:wrap;gap:8px}.avs button{font-size:28px;width:52px;height:52px;border-radius:50%;background:var(--navy);border:3px solid var(--pur2)}
.avs button.sel,.sel{border-color:var(--gold)!important;box-shadow:0 0 12px #FFD86B88}
.row{display:flex;gap:10px}.row>*{flex:1}
#game{padding:0;align-items:stretch}
#top{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;gap:8px}
#menu{display:flex;gap:8px}#menu button,#top .back{width:42px;height:42px;border-radius:50%;background:var(--pur);border:2px solid var(--pur2);font-size:18px;transition:.15s}
#menu button:hover{transform:scale(1.12);border-color:var(--gold)}
#stage{position:relative;flex:1;min-height:0}
#table{position:absolute;left:11%;right:11%;top:13%;bottom:20%;border-radius:50%;background:radial-gradient(ellipse at 50% 40%,var(--tf),var(--tf2));border:10px solid #3b2a1f;box-shadow:0 0 0 4px var(--gold),inset 0 0 0 3px #FFD86B88,inset 0 10px 60px #0006,0 25px 50px #000a}
#mascot{position:absolute;left:50%;top:0;transform:translateX(-50%);font-size:clamp(34px,6vw,54px);animation:bob 3s ease-in-out infinite;z-index:3;text-align:center}
#deck{position:absolute;left:calc(50% + 40px);top:8px;width:30px;height:42px;z-index:2}
#deck i{position:absolute;inset:0;border-radius:4px;background:repeating-linear-gradient(45deg,var(--pur),var(--pur) 3px,var(--pur2) 3px,var(--pur2) 6px);border:2px solid var(--gold)}
#deck i:nth-child(2){top:-2px;left:2px}#deck i:nth-child(3){top:-4px;left:4px}
#deck.shuf i:nth-child(1){animation:s1 .9s}#deck.shuf i:nth-child(2){animation:s2 .9s}#deck.shuf i:nth-child(3){animation:s1 .9s .1s}
@keyframes s1{50%{transform:translateX(-40px) rotate(-18deg)}}@keyframes s2{50%{transform:translateX(40px) rotate(18deg)}}
@keyframes bob{50%{transform:translateX(-50%) translateY(-6px)}}
#mid{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;width:90%}
#pot{font-weight:900;margin-bottom:4px;font-size:13px;color:var(--pale)}#pot.bump{animation:pb .3s}@keyframes pb{50%{transform:scale(1.15)}}
.stks{display:flex;gap:4px;justify-content:center;align-items:flex-end;min-height:20px}
.stk{display:flex;flex-direction:column-reverse}
.chip{width:24px;height:24px;border-radius:50%;border:3px dashed #ffffffcc;box-shadow:0 2px 0 #0008,inset 0 0 0 2px #0004;margin-top:-18px;flex:none}.chip:first-child{margin-top:0}
#board{display:flex;gap:6px;justify-content:center;margin-top:8px}
.card{width:clamp(34px,6.2vw,58px);aspect-ratio:5/7;border-radius:7px;background:#fffaf0;color:#111;font-weight:900;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:clamp(14px,2.6vw,24px);box-shadow:0 3px 6px #0006;line-height:1;transition:transform .15s}
.card.r{color:#d11f3a}.card small{font-size:.8em}
.card.bk{background:repeating-linear-gradient(45deg,var(--pur),var(--pur) 4px,var(--pur2) 4px,var(--pur2) 8px);border:2px solid var(--gold);color:var(--gold)}
.card.em{background:#0003;box-shadow:none;border:2px dashed #ffffff44}
.card.deal{animation:dl .6s backwards}@keyframes dl{from{transform:translate(0,-120px) rotate(-30deg) scale(.5);opacity:0}60%{transform:translateY(5px)}}
#res{position:absolute;left:50%;top:67%;transform:translateX(-50%);font-weight:900;color:var(--gold);text-shadow:0 2px 6px #000;text-align:center;font-size:clamp(13px,2.4vw,18px);z-index:5;width:80%}
.seat{position:absolute;transform:translate(-50%,-50%);width:clamp(84px,15vw,128px);text-align:center;z-index:4}
.av{position:relative;width:clamp(38px,6vw,54px);height:clamp(38px,6vw,54px);margin:0 auto -8px;border-radius:50%;background:var(--pur2);border:3px solid var(--blue);font-size:clamp(20px,3.6vw,30px);display:flex;align-items:center;justify-content:center;box-shadow:0 3px 8px #0008;animation:bob2 4s ease-in-out infinite}
@keyframes bob2{50%{transform:translateY(-3px)}}
.seat.turn .av{border-color:var(--gold);box-shadow:0 0 0 4px #FFD86B66,0 0 18px var(--gold);animation:pul 1s infinite}@keyframes pul{50%{box-shadow:0 0 0 8px #FFD86B33,0 0 24px var(--gold)}}
.seat.fold{opacity:.5}.seat.win .av{border-color:var(--gold);box-shadow:0 0 25px var(--gold)}
.d{position:absolute;right:-8px;bottom:-2px;background:#fff;color:#111;border-radius:50%;width:18px;height:18px;font-size:11px;line-height:18px;border:2px solid var(--gold)}
.pn{background:#21163Dcc;border:2px solid var(--pur2);border-radius:10px;padding:10px 4px 3px;backdrop-filter:blur(2px)}
.seat.turn .pn{border-color:var(--gold);background:#47336Fee}
.nm{font-size:clamp(9px,1.6vw,12px);font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.nm i{background:var(--coral);color:#111;border-radius:6px;padding:0 3px;margin-left:3px;font-size:8px;font-style:normal}
.ch{font-size:clamp(11px,2vw,15px);font-weight:900;color:var(--pale)}.st{font-size:10px;color:var(--blue);min-height:12px;font-weight:700}
.bt{position:absolute;left:50%;top:-8px;transform:translateX(-50%);background:var(--gold);color:#111;border-radius:10px;padding:1px 7px;font-size:11px;font-weight:900;white-space:nowrap}
.hc{display:flex;justify-content:center;gap:2px;margin-bottom:12px;height:auto}
.hc .card{width:clamp(22px,4vw,36px);font-size:clamp(10px,1.8vw,15px)}
.seat.me .hc{margin-bottom:14px;gap:6px}.seat.me .hc .card{width:clamp(44px,9vw,72px);font-size:clamp(18px,3.6vw,30px)}
.seat.me .hc .card:hover{transform:translateY(-8px)}.seat.me .hc .card:first-child{transform:rotate(-5deg)}.seat.me .hc .card:last-child{transform:rotate(5deg)}
.dots span{animation:dt 1s infinite}.dots span:nth-child(2){animation-delay:.2s}.dots span:nth-child(3){animation-delay:.4s}@keyframes dt{50%{opacity:.2}}
#act{padding:8px 10px 12px;background:#101329dd;border-top:2px solid var(--pur2)}
#quick{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;align-items:center;margin-bottom:8px}
#quick button{background:var(--ind);border:2px solid var(--pur2);border-radius:12px;padding:6px 10px;font-weight:800;min-height:36px;transition:.15s}
#quick button:hover{transform:translateY(-2px);border-color:var(--gold)}
#amt{width:120px;padding:8px}#add{font-size:12px;color:var(--mut)}
#btns{display:flex;gap:10px;justify-content:center}
#btns button{flex:1;max-width:200px;min-height:48px;border-radius:14px;font-weight:900;background:var(--pur);border:3px solid var(--em);box-shadow:0 4px 0 #0007;transition:.12s;font-size:15px}
#btns button:hover:not(:disabled){transform:translateY(-3px);border-color:var(--gold)}#btns button:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 #0007}
#bFold{background:var(--navy)!important;border-color:var(--coral)!important}
button:disabled{opacity:.4;cursor:not-allowed}button:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
#fx{position:absolute;inset:0;pointer-events:none;z-index:6}
.fl{position:absolute;font-size:34px;transform:translate(-50%,-50%);animation:up 2.4s forwards}
@keyframes up{0%{opacity:0;transform:translate(-50%,0) scale(.4)}15%{opacity:1;transform:translate(-50%,-30px) scale(1.2)}85%{opacity:1}100%{opacity:0;transform:translate(-50%,-80px)}}
.fly{position:fixed;z-index:50;pointer-events:none;margin:0!important}
#toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);background:var(--ind);border:2px solid var(--gold);border-radius:14px;padding:8px 16px;z-index:60;opacity:0;transition:.3s;pointer-events:none;font-weight:700}
#toast.on{opacity:1;top:80px}
.modal{position:fixed;inset:0;background:#000a;z-index:70;display:none;align-items:center;justify-content:center;padding:14px}.modal.on{display:flex}
.modal>div{background:var(--ind);border:3px solid var(--gold);border-radius:18px;padding:18px;max-width:480px;width:100%;max-height:85vh;overflow:auto;animation:fi .25s}
.stk6{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;font-size:30px;text-align:center}.stk6 button{background:var(--navy);border:2px solid var(--pur2);border-radius:12px;padding:6px}
.rm *{animation:none!important;transition:none!important}
@media(max-width:600px){#table{left:6%;right:6%;top:15%;bottom:24%;border-width:6px}.seat{width:78px}.fc{width:44%}}

body[data-theme=neon]{background:linear-gradient(#1a0b3d,#3b0f5c 55%,#0f2a4d)}
body[data-theme=resort]{background:linear-gradient(#2c3e6b,#c97b63 70%,#f2b880)}
body[data-theme=tropic]{background:linear-gradient(#0d2a4a,#12607a 60%,#e08a5b)}
body[data-theme=space]{background:radial-gradient(circle at 70% 30%,#3a1d6e,#0a0a1f 70%)}
.feat{width:44px;height:44px;display:block;margin:0 auto 6px}.av svg,.avs svg{width:100%;height:100%;border-radius:50%}
.avs button{padding:0;overflow:hidden}.avs button svg{width:100%;height:100%}
.stk6 svg{width:46px;height:46px}.fl svg{width:52px;height:52px}
#menu svg{width:22px;height:22px}#menu button{display:flex;align-items:center;justify-content:center;padding:0}
#conn{position:fixed;left:8px;bottom:8px;z-index:80;font-size:11px;background:var(--ind);border:2px solid var(--pur2);border-radius:10px;padding:2px 8px}
#conn.off{border-color:var(--coral);color:var(--coral)}
.tabs{display:flex;gap:8px;margin-bottom:8px}.tabs button{flex:1;padding:8px;border-radius:12px;background:var(--navy);border:2px solid var(--pur2);font-weight:800}
.big{font-size:40px;font-weight:900;letter-spacing:8px;color:var(--gold);text-align:center}
.pl{display:flex;align-items:center;gap:10px;padding:6px;border-radius:12px;background:var(--navy);margin:6px 0}.pl .a{width:40px;height:40px}.pl svg{width:100%;height:100%}
.pl.empty{border:2px dashed var(--pur2);background:none;color:var(--mut);justify-content:center}
#chat{position:absolute;right:6px;bottom:6px;width:min(260px,70%);z-index:8;background:#21163Dee;border:2px solid var(--pur2);border-radius:14px;display:none;flex-direction:column;max-height:45%}
#chat.on{display:flex}#chatlog{overflow:auto;padding:8px;font-size:12px;flex:1;min-height:60px}#chatlog p{margin:3px 0;background:var(--ind);border-radius:10px;padding:4px 8px}
#chat input{border-radius:0 0 12px 12px;border:0;border-top:2px solid var(--pur2)}
</style></head><body data-theme="forest">
<div id="bg"></div><div id="conn">connecting…</div>
<section class="scr on" id="landing">
<nav><button onclick="show('setup')">Play</button><button onclick="help()">How to Play</button><button onclick="settings()">Settings</button></nav>
<div class="logo">♠ POKER<br><b>PARTY</b> ♥</div>
<div class="tag">Good Friends. Great Cards. Legendary Nights.</div>
<button class="play" onclick="show('setup')">PLAY</button>
<div class="cards" id="feats"></div></section>

<section class="scr" id="setup"><div class="panel"><h2>Take your seat</h2>
<label>Username</label><input id="uname" maxlength="12" value="Player" aria-label="Username">
<label>Avatar</label><div class="avs" id="avs"></div>
<div class="tabs" style="margin-top:12px"><button id="tc" class="sel" onclick="tab('c')">Create room</button><button id="tj" onclick="tab('j')">Join room</button></div>
<div id="pc"><div class="row"><div><label>Starting chips</label><select id="sc"><option>1000</option><option selected>2000</option><option>5000</option></select></div><div><label>Blinds</label><select id="bl"><option value="10">10 / 20</option><option value="25">25 / 50</option></select></div><div><label>Max players</label><select id="mp"></select></div></div>
<button class="play" style="width:100%;padding:12px;margin-top:14px" onclick="createRoom()">CREATE ROOM</button></div>
<div id="pj" style="display:none"><label>Room code</label><input id="code" maxlength="5" style="text-transform:uppercase;letter-spacing:6px;text-align:center" aria-label="Room code">
<button class="play" style="width:100%;padding:12px;margin-top:14px" onclick="joinRoom()">JOIN ROOM</button></div>
<p style="color:var(--mut);font-size:12px">Virtual chips only. No real money, ever.</p></div></section>

<section class="scr" id="lobby"><div class="panel"><h2>Private lounge</h2><div class="big" id="lcode"></div>
<div class="row" style="margin:10px 0"><button class="pill" onclick="copyLink()">Copy invite link</button><button class="pill" onclick="leave()">Leave</button></div>
<div id="lpl"></div>
<div id="host" style="display:none"><div class="row"><select id="bd"><option>easy</option><option selected>medium</option><option>hard</option></select><button class="pill" onclick="send({t:'addBot',diff:$('#bd').value})">+ Add bot</button></div>
<button class="play" style="width:100%;padding:12px;margin-top:12px" onclick="send({t:'start'})">START GAME</button></div>
<p id="wait" style="color:var(--mut)">Waiting for the host to start…</p></div></section>

<section class="scr" id="game"><div id="top"><button class="back" onclick="leave()" aria-label="Leave table">←</button>
<div class="pill" id="hn">Hand 1</div>
<div id="menu"><button onclick="stickers()" title="Stickers" aria-label="Stickers" id="mS"></button><button onclick="$('#chat').classList.toggle('on')" title="Chat" aria-label="Chat" id="mC"></button><button onclick="hist()" title="History" aria-label="History" id="mH"></button><button onclick="help()" title="Help" aria-label="Help" id="mQ"></button><button onclick="settings()" title="Settings" aria-label="Settings" id="mG"></button></div></div>
<div id="stage"><div id="mascot"></div><div id="deck"><i></i><i></i><i></i></div><div id="table"><div id="mid"><div id="pot"></div><div class="stks" id="ps"></div><div id="board"></div></div></div><div id="res"></div><div id="seats"></div><div id="fx"></div>
<div id="chat"><div id="chatlog"></div><input id="cin" maxlength="200" placeholder="Say something…" aria-label="Chat message"></div></div>
<div id="act"><div id="quick"><button data-q="25">25</button><button data-q="50">50</button><button data-q="100">100</button><button data-q="200">200</button><button data-q="500">500</button><input id="amt" type="number" min="0" step="1" placeholder="Custom amount" aria-label="Custom amount"><button id="sMin">Min</button><button id="sHalf">½ Pot</button><button id="sPot">Pot</button><button id="sAll">All-in</button><span id="add"></span></div>
<div id="btns"><button id="bFold">FOLD</button><button id="bCall">CHECK</button><button id="bRaise">BET</button></div></div></section>
<div class="modal" id="modal" onclick="if(event.target===this)this.classList.remove('on')"><div id="mb"></div></div><div id="toast"></div>
<script>
const $=s=>document.querySelector(s),wait=ms=>new Promise(r=>setTimeout(r,ms));
const SU=['♠','♥','♦','♣'],RK={11:'J',12:'Q',13:'K',14:'A'};
const DEN=[[500,'#d4a017'],[200,'#7b3fbf'],[100,'#222'],[50,'#c0392b'],[25,'#27ae60'],[10,'#2e86de'],[5,'#dfe6e9']];
// ---------- SVG art ----------
const sv=b=>`<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">${b}</svg>`;
const EY=(c='#fff')=>`<circle cx="24" cy="32" r="5" fill="${c}"/><circle cx="40" cy="32" r="5" fill="${c}"/><circle cx="25" cy="33" r="2.4" fill="#222"/><circle cx="41" cy="33" r="2.4" fill="#222"/>`;
const SM='<path d="M24 44q8 7 16 0" stroke="#222" stroke-width="2.5" fill="none" stroke-linecap="round"/>';
const BG=c=>`<rect width="64" height="64" fill="${c}"/>`;
const AVD={
astro:BG('#2b3a7a')+'<circle cx="32" cy="34" r="24" fill="#eef1fa" stroke="#8f9bc4" stroke-width="3"/><rect x="14" y="22" width="36" height="24" rx="12" fill="#1c2b5e"/><circle cx="25" cy="34" r="3" fill="#5DC9FF"/><circle cx="39" cy="34" r="3" fill="#5DC9FF"/><path d="M27 40q5 4 10 0" stroke="#5DC9FF" stroke-width="2" fill="none"/><circle cx="32" cy="8" r="3" fill="#FF739C"/>',
robot:BG('#3d3a7a')+'<rect x="12" y="18" width="40" height="36" rx="10" fill="#aab4d4"/><rect x="29" y="6" width="6" height="12" fill="#8b95b8"/><circle cx="32" cy="6" r="4" fill="#FF739C"/><rect x="18" y="26" width="28" height="14" rx="6" fill="#101329"/><circle cx="26" cy="33" r="3.5" fill="#54E7DF"/><circle cx="38" cy="33" r="3.5" fill="#54E7DF"/><rect x="24" y="45" width="16" height="4" rx="2" fill="#47336F"/>',

if(prev&&prev.hand===s.hand)s.players.forEach(p=>{const q=prev.players.find(x=>x.id===p.id);if(q&&p.bet>q.bet){fly(seatEl(p.id),$('#ps'),p.bet-q.bet);snd(700,.05)}});
if(s.win.length&&(!prev||!prev.win.length||prev.hand!==s.hand)){s.win.forEach(w=>fly($('#ps'),seatEl(w.id),w.amount,1));snd(800,.3);snd(1000,.3)}
if(newHand&&s.state==='hand'){$('#deck').classList.add('shuf');setTimeout(()=>$('#deck').classList.remove('shuf'),900);snd(300)}
if(prev&&s.board.length>prev.board.length&&prev.hand===s.hand)snd(450);
tick();updAct()}
function tick(){if(!ST_||!ST_.deadline)return document.querySelectorAll('.tmr').forEach(e=>e.textContent='');const r=Math.max(0,Math.ceil((ST_.deadline-(Date.now()-off))/1000)),t=String(Math.floor(r/60)).padStart(2,'0')+':'+String(r%60).padStart(2,'0');document.querySelectorAll('.tmr').forEach(e=>{e.textContent=(e.dataset.you==='1'?'YOUR TURN ':'')+t;e.style.color=r<=10?'#ff739c':''})}
setInterval(tick,300);
function updAct(){const s=ST_,me=s&&s.players.find(p=>p.id===ID),mine=!!me&&s.to===ID;
['bFold','bCall','bRaise','sMin','sHalf','sPot','sAll','amt'].forEach(id=>$('#'+id).disabled=!mine);document.querySelectorAll('#quick [data-q]').forEach(b=>b.disabled=!mine);
if(!me){$('#add').textContent='Spectating';return}
const need=s.cur-me.bet,mx=me.bet+me.chips,v=+$('#amt').value;
$('#bCall').textContent=need>0?'CALL '+Math.min(need,me.chips):'CHECK';$('#bRaise').textContent=(s.cur?'RAISE':'BET')+(v?' TO '+v:'');
const ca=mine&&me.chips>need;['bRaise','sMin','sHalf','sPot','sAll','amt'].forEach(id=>$('#'+id).disabled=!ca);document.querySelectorAll('#quick [data-q]').forEach(b=>b.disabled=!ca);
$('#add').textContent=v&&mine?'You add '+Math.max(0,Math.min(v,mx)-me.bet)+' (total '+Math.min(v,mx)+')':mine?'min '+Math.min(s.minTo,mx):''}
function setAmt(v){const s=ST_,me=s.players.find(p=>p.id===ID),mx=me.bet+me.chips;v=Math.max(Math.min(s.minTo,mx),Math.min(Math.round(v),mx));$('#amt').value=v;document.querySelectorAll('#quick [data-q]').forEach(b=>b.classList.toggle('sel',s.cur+(+b.dataset.q)===v));updAct()}
document.querySelectorAll('#quick [data-q]').forEach(b=>b.onclick=()=>setAmt(ST_.cur+ +b.dataset.q));
const myBet=()=>ST_.players.find(p=>p.id===ID).bet;
$('#sMin').onclick=()=>setAmt(ST_.minTo);$('#sHalf').onclick=()=>setAmt(ST_.cur+(ST_.pot+ST_.cur-myBet())/2);$('#sPot').onclick=()=>setAmt(ST_.cur+ST_.pot+ST_.cur-myBet());$('#sAll').onclick=()=>setAmt(1e9);$('#amt').oninput=updAct;
const act=(type,amount)=>send({t:'act',type,amount,ver:ST_.ver});
$('#bFold').onclick=()=>act('fold');$('#bCall').onclick=()=>act(ST_.cur-myBet()>0?'call':'check');
$('#bRaise').onclick=()=>{const v=+$('#amt').value;if(!v)return toast('Choose an amount');act('raise',v);$('#amt').value=''};
// ---------- stickers & menus ----------
function floatSticker(from,k){const el=ST_&&seatEl(from);if(!el)return;const d=document.createElement('div');d.className='fl';d.innerHTML=STK(k);d.style.left=el.style.left;d.style.top=(parseFloat(el.style.top)-8)+'%';$('#fx').appendChild(d);setTimeout(()=>d.remove(),2400);snd(1100,.06)}
function stickers(){modal('<h2>Stickers</h2><div class="stk6">'+Object.keys(ST).map(k=>`<button onclick="sendSt('${k}')" aria-label="Send ${k}">${STK(k)}</button>`).join('')+'</div>')}
function sendSt(k){if(Date.now()-lastSt<2000)return toast('Sticker cooldown');lastSt=Date.now();$('#modal').classList.remove('on');send({t:'sticker',sticker:k,to:null})}
function help(){modal('<h2>How to Play</h2><p>No-Limit Texas Hold\'em. Two private cards, five community cards; best five-card hand wins.</p><ol style="padding-left:20px;line-height:1.6"><li>Royal Flush</li><li>Straight Flush</li><li>Four of a Kind</li><li>Full House</li><li>Flush</li><li>Straight (A high or low)</li><li>Three of a Kind</li><li>Two Pair</li><li>One Pair</li><li>High Card</li></ol><p>You have 60 seconds per turn or the server folds for you.</p>')}
function hist(){const h=ST_?ST_.hist:[];modal('<h2>Game History</h2>'+(h.length?h.slice(0,15).map(x=>`<p style="margin:6px 0;font-size:13px">#${x.hand}: ${esc(x.text)} ${x.board.length?'| '+x.board.map(c=>(RK[c.r]||c.r)+SU[c.s]).join(' '):''}</p>`).join(''):'<p>No hands finished yet.</p>'))}
function settings(){modal(`<h2>Settings</h2><label>Background theme</label><select onchange="setTheme(this.value)">${Object.entries(THEMES).map(([k,v])=>`<option value="${k}" ${document.body.dataset.theme===k?'selected':''}>${v}</option>`).join('')}</select><label>Sound</label><select onchange="snd_=this.value==='1'"><option value="1" ${snd_?'selected':''}>On</option><option value="0" ${snd_?'':'selected'}>Off</option></select><label>Reduced motion</label><select onchange="rm=this.value==='1';document.body.classList.toggle('rm',rm)"><option value="0" ${rm?'':'selected'}>Off</option><option value="1" ${rm?'selected':''}>On</option></select>`)}
// ---------- init ----------
$('#avs').innerHTML=AVK.map(k=>`<button class="${k===AV?'sel':''}" data-k="${k}" aria-label="Avatar ${k}">${av(k)}</button>`).join('');
$('#avs').onclick=e=>{const b=e.target.closest('button');if(!b)return;AV=b.dataset.k;document.querySelectorAll('#avs button').forEach(x=>x.classList.toggle('sel',x===b))};
$('#uname').value=NAME;$('#mp').innerHTML=[2,3,4,5,6,7,8,9,10].map(n=>`<option ${n===6?'selected':''}>${n}</option>`).join('');
$('#feats').innerHTML=[['astro','Play With Friends'],['robot','Private Game Rooms'],['frog','Intelligent Bots'],['party','Stickers & Reactions'],['chip','Customize Your Table']].map(([k,t])=>`<div class="fc"><div class="feat">${ST[k]?STK(k):av(k)}</div>${t}</div>`).join('');
$('#mascot').innerHTML=MASCOT;$('#mascot').style.width='56px';
[['mS','S'],['mC','C'],['mH','H'],['mQ','Q'],['mG','G']].forEach(([i,k])=>$('#'+i).innerHTML=ic(k));
setTheme(LS('pp_theme')||'forest');
const q=new URLSearchParams(location.search).get('room');if(q&&!ROOM){$('#code').value=q.toUpperCase();tab('j');show('setup')}
if(ROOM)toast('Rejoining your table…');
Object.defineProperties(window,{ws:{get:()=>ws},ST_:{get:()=>ST_},ID:{get:()=>ID}});
connect();
</script></body></html>
